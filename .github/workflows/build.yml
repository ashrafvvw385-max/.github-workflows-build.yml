              package com.example.speedlimiter

              import android.app.Notification
              import android.app.NotificationChannel
              import android.app.NotificationManager
              import android.app.PendingIntent
              import android.content.Intent
              import android.net.ProxyInfo
              import android.net.VpnService
              import android.os.Build
              import android.os.ParcelFileDescriptor
              import androidx.core.app.NotificationCompat
              import kotlin.concurrent.thread

              class SpeedVpnService : VpnService() {

                  companion object {
                      @Volatile var isRunning = false
                      @Volatile var downLimitKB = 256
                      @Volatile var upLimitKB = 128
                      @Volatile var targetAppPkg = ""
                      @Volatile var blockCompletely = false
                  }

                  private var vpnInterface: ParcelFileDescriptor? = null

                  override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                      if (intent?.action == "STOP_VPN") {
                          stopVpn()
                          return START_NOT_STICKY
                      }

                      downLimitKB = intent?.getIntExtra("downKB", 256) ?: 256
                      upLimitKB = intent?.getIntExtra("upKB", 128) ?: 128
                      targetAppPkg = intent?.getStringExtra("targetPkg") ?: ""
                      blockCompletely = intent?.getBooleanExtra("blockApp", false) ?: false

                      startForegroundNotification()
                      startVpnEngine()
                      return START_STICKY
                  }

                  private fun startForegroundNotification() {
                      val channelId = "speed_elite_channel"
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val channel = NotificationChannel(
                              channelId,
                              "Speed Limiter Elite VPN",
                              NotificationManager.IMPORTANCE_LOW
                          )
                          val manager = getSystemService(NotificationManager::class.java)
                          manager?.createNotificationChannel(channel)
                      }

                      val openIntent = Intent(this, MainActivity::class.java)
                      val pendingOpen = PendingIntent.getActivity(
                          this, 0, openIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val text = if (blockCompletely) "حظر التطبيق مفعل (Firewall)" else "تنزيل: $downLimitKB KB/s | رفع: $upLimitKB KB/s"

                      val notification: Notification = NotificationCompat.Builder(this, channelId)
                          .setContentTitle("متحكم السرعة Elite (نشط)")
                          .setContentText(text)
                          .setSmallIcon(android.R.drawable.ic_menu_compass)
                          .setContentIntent(pendingOpen)
                          .setOngoing(true)
                          .build()

                      startForeground(202, notification)
                  }

                  private fun startVpnEngine() {
                      if (isRunning) {
                          try { vpnInterface?.close() } catch (_: Exception) {}
                          vpnInterface = null
                      }
                      isRunning = true

                      thread {
                          while (isRunning) {
                              try {
                                  val builder = Builder()
                                      .setSession("SpeedLimiterEliteVPN")
                                      .addAddress("10.20.30.1", 32)
                                      .addDnsServer("8.8.8.8")
                                      .setMtu(1280)

                                  if (targetAppPkg.isNotEmpty()) {
                                      try { builder.addAllowedApplication(targetAppPkg) } catch (_: Exception) {}
                                  } else {
                                      try { builder.addDisallowedApplication(packageName) } catch (_: Exception) {}
                                  }

                                  if (blockCompletely) {
                                      builder.addRoute("0.0.0.0", 0)
                                      vpnInterface = builder.establish()
                                      while (isRunning && blockCompletely) { Thread.sleep(500) }
                                  } else {
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                          builder.setHttpProxy(ProxyInfo.buildDirectProxy("127.0.0.1", 8888))
                                      }
                                      if (downLimitKB >= 1024) {
                                          vpnInterface = builder.establish()
                                          Thread.sleep(1000)
                                      } else {
                                          builder.addRoute("0.0.0.0", 0)
                                          vpnInterface = builder.establish()
                                          val pause = ((1024 - downLimitKB).coerceIn(100, 950)).toLong()
                                          val pass = (1000L - pause).coerceAtLeast(80L)
                                          Thread.sleep(pause)
                                          try { vpnInterface?.close() } catch (_: Exception) {}
                                          vpnInterface = null
                                          Thread.sleep(pass)
                                      }
                                  }
                              } catch (_: Exception) {
                                  Thread.sleep(500)
                              }
                          }
                      }
                  }

                  private fun stopVpn() {
                      isRunning = false
                      try { vpnInterface?.close() } catch (_: Exception) {}
                      vpnInterface = null
                      stopForeground(true)
                      stopSelf()
                  }

                  override fun onDestroy() {
                      stopVpn()
                      super.onDestroy()
                  }
              }
          ''')

          write_clean_file("app/src/main/java/com/example/speedlimiter/MainActivity.kt", r'''
              package com.example.speedlimiter

              import android.app.Activity
              import android.app.AlertDialog
              import android.content.Context
              import android.content.Intent
              import android.graphics.Color
              import android.net.TrafficStats
              import android.net.VpnService
              import android.os.Build
              import android.os.Bundle
              import android.os.Handler
              import android.os.Looper
              import android.widget.CheckBox
              import android.widget.EditText
              import android.widget.RadioButton
