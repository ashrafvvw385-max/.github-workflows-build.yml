              import android.widget.TextView
              import android.widget.Toast
              import androidx.appcompat.app.AppCompatActivity
              import com.google.android.material.button.MaterialButton
              import java.io.BufferedReader
              import java.io.DataOutputStream
              import java.io.InputStream
              import java.io.InputStreamReader
              import java.io.OutputStream
              import java.net.InetSocketAddress
              import java.net.ServerSocket
              import java.net.Socket
              import java.util.Locale
              import kotlin.concurrent.thread
              import kotlin.system.measureTimeMillis

              class MainActivity : AppCompatActivity() {

                  @Volatile private var downSpeedKB = 256
                  @Volatile private var upSpeedKB = 128
                  @Volatile private var isProxyRunning = false
                  private var proxyServerSocket: ServerSocket? = null

                  private val monitorHandler = Handler(Looper.getMainLooper())
                  private var lastRxBytes = 0L
                  private var lastTxBytes = 0L
                  private var sessionBytes = 0L
                  private var lastPingMs = -1L
                  private var tickCounter = 0

                  private lateinit var tvLiveDown: TextView
                  private lateinit var tvLiveUp: TextView
                  private lateinit var tvSessionUsage: TextView
                  private lateinit var tvDownLimitLabel: TextView
                  private lateinit var tvUpLimitLabel: TextView
                  private lateinit var seekBarDown: SeekBar
                  private lateinit var seekBarUp: SeekBar
                  private lateinit var etTargetApp: EditText
                  private lateinit var cbBlockApp: CheckBox
                  private lateinit var tvStatus: TextView

                  private val speedMonitorRunnable = object : Runnable {
                      override fun run() {
                          val currentRx = TrafficStats.getTotalRxBytes()
                          val currentTx = TrafficStats.getTotalTxBytes()

                          if (lastRxBytes != 0L && lastTxBytes != 0L &&
                              currentRx != TrafficStats.UNSUPPORTED.toLong()) {
                              val rxDelta = (currentRx - lastRxBytes).coerceAtLeast(0L)
                              val txDelta = (currentTx - lastTxBytes).coerceAtLeast(0L)
                              sessionBytes += (rxDelta + txDelta)

                              val pingStr = if (lastPingMs >= 0) "${lastPingMs} ms" else "-- ms"
                              tvLiveDown.text = String.format(Locale.US, "%.1f KB/s ↓", rxDelta / 1024.0)
                              tvLiveUp.text = String.format(Locale.US, "%.1f KB/s ↑", txDelta / 1024.0)
                              tvSessionUsage.text = String.format(
                                  Locale.US,
                                  "الاستهلاك: %.2f MB | البينج: %s",
                                  sessionBytes / (1024.0 * 1024.0),
                                  pingStr
                              )
                          }

                          tickCounter++
                          if (tickCounter % 5 == 0) { measurePingAsync() }

                          lastRxBytes = currentRx
                          lastTxBytes = currentTx
                          monitorHandler.postDelayed(this, 1000)
                      }
                  }

                  private fun measurePingAsync() {
                      thread {
                          try {
                              val ms = measureTimeMillis {
                                  Socket().use { s -> s.connect(InetSocketAddress("8.8.8.8", 53), 1500) }
                              }
                              lastPingMs = ms
                          } catch (_: Exception) {
                              lastPingMs = -1L
                          }
                      }
                  }

                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      setContentView(R.layout.activity_main)

                      tvLiveDown = findViewById(R.id.tvLiveDown)
                      tvLiveUp = findViewById(R.id.tvLiveUp)
                      tvSessionUsage = findViewById(R.id.tvSessionUsage)
                      tvDownLimitLabel = findViewById(R.id.tvDownLimitLabel)
                      tvUpLimitLabel = findViewById(R.id.tvUpLimitLabel)
                      seekBarDown = findViewById(R.id.seekBarDown)
                      seekBarUp = findViewById(R.id.seekBarUp)
                      etTargetApp = findViewById(R.id.etTargetApp)
                      cbBlockApp = findViewById(R.id.cbBlockApp)
                      tvStatus = findViewById(R.id.tvStatus)

                      val rbVpnMode = findViewById<RadioButton>(R.id.rbVpnMode)
                      val rbProxyMode = findViewById<RadioButton>(R.id.rbProxyMode)

                      val btnPreset64 = findViewById<MaterialButton>(R.id.btnPreset64)
                      val btnPreset256 = findViewById<MaterialButton>(R.id.btnPreset256)
                      val btnPreset512 = findViewById<MaterialButton>(R.id.btnPreset512)
                      val btnPreset1024 = findViewById<MaterialButton>(R.id.btnPreset1024)

                      val btnPickApp = findViewById<MaterialButton>(R.id.btnPickApp)
                      val btnRunSpeedTest = findViewById<MaterialButton>(R.id.btnRunSpeedTest)
                      val btnEnable = findViewById<MaterialButton>(R.id.btnEnable)
                      val btnDisable = findViewById<MaterialButton>(R.id.btnDisable)

                      val prefs = getSharedPreferences("EliteSpeedPrefs", Context.MODE_PRIVATE)
                      downSpeedKB = prefs.getInt("downKB", 256)
                      upSpeedKB = prefs.getInt("upKB", 128)
                      etTargetApp.setText(prefs.getString("targetPkg", ""))
                      updateSliders(downSpeedKB, upSpeedKB)

                      seekBarDown.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              downSpeedKB = if (progress < 16) 16 else progress
                              tvDownLimitLabel.text = "حد التنزيل (Download): $downSpeedKB KB/s"
                              SpeedVpnService.downLimitKB = downSpeedKB
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })

                      seekBarUp.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              upSpeedKB = if (progress < 16) 16 else progress
                              tvUpLimitLabel.text = "حد الرفع (Upload): $upSpeedKB KB/s"
                              SpeedVpnService.upLimitKB = upSpeedKB
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })

                      btnPreset64.setOnClickListener { updateSliders(64, 32) }
                      btnPreset256.setOnClickListener { updateSliders(256, 128) }
                      btnPreset512.setOnClickListener { updateSliders(512, 256) }
                      btnPreset1024.setOnClickListener { updateSliders(1024, 512) }

                      btnPickApp.setOnClickListener { showInstalledAppsDialog() }

                      btnRunSpeedTest.setOnClickListener {
                          Toast.makeText(this, "جاري فحص اتصال الإنترنت...", Toast.LENGTH_SHORT).show()
                          measurePingAsync()
                      }

                      btnEnable.setOnClickListener {
                          val targetPkg = etTargetApp.text.toString().trim()
                          prefs.edit().putInt("downKB", downSpeedKB).putInt("upKB", upSpeedKB).putString("targetPkg", targetPkg).apply()

                          when {
                              rbVpnMode.isChecked -> {
                                  startLocalProxyEngine(silent = true)
                                  val vpnIntent = VpnService.prepare(this)
                                  if (vpnIntent != null) {
                                      startActivityForResult(vpnIntent, 1002)
                                  } else {
                                      launchVpnService()
                                  }
                              }
                              rbProxyMode.isChecked -> {
                                  startLocalProxyEngine(silent = false)
                              }
                              else -> {
                                  thread {
                                      val ok = applyRootTcLimit(downSpeedKB, upSpeedKB)
                                      runOnUiThread {
                                          if (ok) {
                                              tvStatus.text = "نشط (وضع الروت): $downSpeedKB↓ / $upSpeedKB↑ KB/s"
                                              tvStatus.setTextColor(Color.parseColor("#10B981"))
                                          } else {
                                              tvStatus.text = "فشل: الجهاز ليس مروتـاً! اختر VPN"
                                              tvStatus.setTextColor(Color.parseColor("#EF4444"))
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      btnDisable.setOnClickListener { stopAllEngines() }
                  }

                  private fun showInstalledAppsDialog() {
                      try {
                          val pm = packageManager
                          val packages = pm.getInstalledPackages(0)
                              .filter { pm.getLaunchIntentForPackage(it.packageName) != null }
                              .sortedBy { it.packageName }

                          val names = packages.map {
                              try { pm.getApplicationLabel(it.applicationInfo).toString() + "\n(" + it.packageName + ")" } catch (_: Exception) { it.packageName }
                          }.toTypedArray()

                          val pNames = packages.map { it.packageName }.toTypedArray()

                          AlertDialog.Builder(this)
                              .setTitle("اختر تطبيقاً لتقييده")
                              .setItems(names) { _, which ->
                                  etTargetApp.setText(pNames[which])
                              }
                              .show()
                      } catch (e: Exception) {
                          Toast.makeText(this, "تعذر جلب التطبيقات", Toast.LENGTH_SHORT).show()
                      }
                  }

                  @Deprecated("Deprecated in Java")
                  override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                      super.onActivityResult(requestCode, resultCode, data)
                      if (requestCode == 1002 && resultCode == Activity.RESULT_OK) {
                          launchVpnService()
                      }
                  }

                  private fun launchVpnService() {
                      val targetPkg = etTargetApp.text.toString().trim()
                      val blockApp = cbBlockApp.isChecked

                      val intent = Intent(this, SpeedVpnService::class.java).apply {
                          putExtra("downKB", downSpeedKB)
                          putExtra("upKB", upSpeedKB)
                          putExtra("targetPkg", targetPkg)
                          putExtra("blockApp", blockApp)
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }

                      tvStatus.text = if (blockApp) "نشط (Firewall): تم حظر التطبيق" else "نشط (VPN Elite): تنزيل $downSpeedKB | رفع $upSpeedKB KB/s"
                      tvStatus.setTextColor(Color.parseColor("#10B981"))
                  }

                  private fun stopAllEngines() {
                      stopLocalProxyEngine()
                      val intent = Intent(this, SpeedVpnService::class.java).apply { action = "STOP_VPN" }
                      startService(intent)
                      thread { resetRootTcLimit() }

                      tvStatus.text = "الحالة: متوقف تماماً (السرعة كاملة)"
                      tvStatus.setTextColor(Color.parseColor("#94A3B8"))
                  }

                  private fun updateSliders(down: Int, up: Int) {
                      downSpeedKB = down
                      upSpeedKB = up
                      seekBarDown.progress = down
                      seekBarUp.progress = up
                      tvDownLimitLabel.text = "حد التنزيل (Download): $down KB/s"
                      tvUpLimitLabel.text = "حد الرفع (Upload): $up KB/s"
                  }

                  private fun startLocalProxyEngine(silent: Boolean) {
                      if (!silent) {
                          tvStatus.text = "نشط (الوكيل المحلي 127.0.0.1:8888)"
                          tvStatus.setTextColor(Color.parseColor("#38BDF8"))
                      }
                      if (isProxyRunning) return
                      isProxyRunning = true

                      thread {
                          try {
                              proxyServerSocket = ServerSocket(8888)
                              while (isProxyRunning) {
                                  val client = proxyServerSocket?.accept() ?: break
                                  thread { handleProxyConnection(client) }
                              }
                          } catch (_: Exception) {
                              isProxyRunning = false
                          }
                      }
                  }

                  private fun stopLocalProxyEngine() {
                      isProxyRunning = false
                      try { proxyServerSocket?.close() } catch (_: Exception) {}
                      proxyServerSocket = null
                  }

                  private fun handleProxyConnection(client: Socket) {
                      try {
                          val clientIn = client.getInputStream()
                          val clientOut = client.getOutputStream()
                          val reader = BufferedReader(InputStreamReader(clientIn))
                          val req = reader.readLine() ?: run { client.close(); return }
                          val parts = req.split(" ")
                          if (parts.size < 2) { client.close(); return }

                          var line = reader.readLine()
                          while (!line.isNullOrEmpty()) { line = reader.readLine() }

                          if (parts[0].equals("CONNECT", ignoreCase = true)) {
                              val hp = parts[1].split(":")
                              val remote = Socket(hp[0], if (hp.size > 1) hp[1].toInt() else 443)
                              clientOut.write("HTTP/1.1 200 Connection Established\r\n\r\n".toByteArray())
                              clientOut.flush()

                              thread { transferThrottled(clientIn, remote.getOutputStream(), true) }
                              transferThrottled(remote.getInputStream(), clientOut, false)
                              remote.close()
                          }
                          client.close()
                      } catch (_: Exception) {
                          try { client.close() } catch (_: Exception) {}
                      }
                  }

                  private fun transferThrottled(input: InputStream, output: OutputStream, isUpload: Boolean) {
                      val buf = ByteArray(4096)
                      var read: Int
                      var start = System.currentTimeMillis()
                      var total = 0L

                      try {
                          while (input.read(buf).also { read = it } != -1 && isProxyRunning) {
                              output.write(buf, 0, read)
                              output.flush()

                              total += read
                              val limit = if (isUpload) upSpeedKB else downSpeedKB
                              val maxB = (limit * 1024L).coerceAtLeast(16384L)
                              val expMs = (total * 1000L) / maxB
                              val elapsed = System.currentTimeMillis() - start

                              if (expMs > elapsed) { Thread.sleep(expMs - elapsed) }
                              if (System.currentTimeMillis() - start >= 1000L) {
                                  start = System.currentTimeMillis()
                                  total = 0L
                              }
                          }
                      } catch (_: Exception) {}
                  }

                  private fun applyRootTcLimit(downKB: Int, upKB: Int): Boolean {
                      val dKbit = downKB * 8
                      val uKbit = upKB * 8
                      val ifaces = listOf("wlan0", "rmnet_data0", "ccmni0")
                      val cmds = mutableListOf<String>()
                      for (i in ifaces) {
                          cmds.add("tc qdisc del dev $i root 2>/dev/null || true")
                          cmds.add("tc qdisc del dev $i ingress 2>/dev/null || true")
                          cmds.add("tc qdisc add dev $i root tbf rate ${uKbit}kbit burst 32kbit latency 400ms 2>/dev/null || true")
                          cmds.add("tc qdisc add dev $i handle ffff: ingress 2>/dev/null || true")
                          cmds.add("tc filter add dev $i parent ffff: protocol ip prio 50 u32 match ip src 0.0.0.0/0 police rate ${dKbit}kbit burst 64kbit drop flowid :1 2>/dev/null || true")
                      }
                      return runSu(cmds)
                  }

                  private fun resetRootTcLimit(): Boolean {
                      val ifaces = listOf("wlan0", "rmnet_data0", "ccmni0")
                      val cmds = ifaces.flatMap { listOf("tc qdisc del dev $it root 2>/dev/null || true", "tc qdisc del dev $it ingress 2>/dev/null || true") }
                      return runSu(cmds)
                  }

                  private fun runSu(cmds: List<String>): Boolean {
                      return try {
                          val p = Runtime.getRuntime().exec("su")
                          val os = DataOutputStream(p.outputStream)
                          for (c in cmds) os.writeBytes(c + "\n")
                          os.writeBytes("exit\n")
                          os.flush()
                          p.waitFor() == 0
                      } catch (_: Exception) {
                          false
                      }
                  }

                  override fun onResume() {
                      super.onResume()
                      lastRxBytes = TrafficStats.getTotalRxBytes()
                      lastTxBytes = TrafficStats.getTotalTxBytes()
                      measurePingAsync()
                      monitorHandler.post(speedMonitorRunnable)
                  }

                  override fun onPause() {
                      super.onPause()
                      monitorHandler.removeCallbacks(speedMonitorRunnable)
                  }
              }
