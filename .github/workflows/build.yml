name: Build SpeedLimiter True-Per-App APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate True Per-App Structure and Code
        run: |
          python3 - << 'PYEOF'
          import os
          import textwrap

          def write_clean_file(path, content):
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          write_clean_file("settings.gradle", r'''
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "SpeedLimiterPerApp"
              include ':app'
          ''')

          write_clean_file("gradle.properties", r'''
              android.useAndroidX=true
              org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
              android.nonTransitiveRClass=true
          ''')

          write_clean_file("build.gradle", r'''
              plugins {
                  id 'com.android.application' version '8.2.2' apply false
                  id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              }
          ''')

          write_clean_file("app/build.gradle", r'''
              plugins {
                  id 'com.android.application'
                  id 'org.jetbrains.kotlin.android'
              }

              android {
                  namespace 'com.example.speedlimiter'
                  compileSdk 34

                  defaultConfig {
                      applicationId "com.example.speedlimiter"
                      minSdk 24
                      targetSdk 34
                      versionCode 7
                      versionName "7.0-PerApp"
                  }

                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }

                  kotlinOptions {
                      jvmTarget = '17'
                  }
              }

              dependencies {
                  implementation 'androidx.core:core-ktx:1.12.0'
                  implementation 'androidx.appcompat:appcompat:1.6.1'
                  implementation 'com.google.android.material:material:1.11.0'
              }
          ''')

          write_clean_file("app/src/main/AndroidManifest.xml", r'''
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                  <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

                  <application
                      android:allowBackup="true"
                      android:label="متحكم السرعة لكل تطبيق"
                      android:supportsRtl="true"
                      android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">

                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:screenOrientation="portrait">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>

                      <service
                          android:name=".SpeedVpnService"
                          android:permission="android.permission.BIND_VPN_SERVICE"
                          android:foregroundServiceType="specialUse"
                          android:exported="false">
                          <intent-filter>
                              <action android:name="android.net.VpnService" />
                          </intent-filter>
                          <property
                              android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                              android:value="True per-app real bandwidth throttling" />
                      </service>

                  </application>
              </manifest>
          ''')

          write_clean_file("app/src/main/res/layout/activity_main.xml", r'''
              <?xml version="1.0" encoding="utf-8"?>
              <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
                  xmlns:app="http://schemas.android.com/apk/res-auto"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:fillViewport="true"
                  android:background="#030712">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="16dp"
                      android:gravity="center_horizontal"
                      android:layoutDirection="rtl">

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="محدد السرعة الحقيقي لكل تطبيق"
                          android:textSize="21sp"
                          android:textStyle="bold"
                          android:textColor="#F9FAFB"
                          android:gravity="center"
                          android:layout_marginBottom="2dp"/>

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="تحكم حقيقي في سرعة كل تطبيق على حدة بدون روت"
                          android:textSize="11sp"
                          android:textColor="#38BDF8"
                          android:gravity="center"
                          android:layout_marginBottom="14dp"/>

                      <!-- بطاقة الإحصائيات -->
                      <com.google.android.material.card.MaterialCardView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          app:cardBackgroundColor="#0F172A"
                          app:cardCornerRadius="16dp"
                          app:strokeColor="#1E293B"
                          app:strokeWidth="1dp"
                          android:layout_marginBottom="12dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:padding="14dp">

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"
                                  android:gravity="center">

                                  <LinearLayout
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:orientation="vertical"
                                      android:gravity="center">

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="التنزيل اللحظي"
                                          android:textSize="11sp"
                                          android:textColor="#94A3B8"/>

                                      <TextView
                                          android:id="@+id/tvLiveDown"
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="0.0 KB/s ↓"
                                          android:textSize="16sp"
                                          android:textStyle="bold"
                                          android:textColor="#38BDF8"
                                          android:layout_marginTop="2dp"/>
                                  </LinearLayout>

                                  <View
                                      android:layout_width="1dp"
                                      android:layout_height="32dp"
                                      android:background="#334155"/>

                                  <LinearLayout
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:orientation="vertical"
                                      android:gravity="center">

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="الرفع اللحظي"
                                          android:textSize="11sp"
                                          android:textColor="#94A3B8"/>

                                      <TextView
                                          android:id="@+id/tvLiveUp"
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="0.0 KB/s ↑"
                                          android:textSize="16sp"
                                          android:textStyle="bold"
                                          android:textColor="#A855F7"
                                          android:layout_marginTop="2dp"/>
                                  </LinearLayout>
                              </LinearLayout>

                              <TextView
                                  android:id="@+id/tvSessionUsage"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="استهلاك الجلسة: 0.00 MB | البينج: -- ms"
                                  android:textSize="12sp"
                                  android:textColor="#CBD5E1"
                                  android:gravity="center"
                                  android:layout_marginTop="10dp"/>
                          </LinearLayout>
                      </com.google.android.material.card.MaterialCardView>

                      <!-- بطاقة اختيار التطبيق والسرعة -->
                      <com.google.android.material.card.MaterialCardView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          app:cardBackgroundColor="#0F172A"
                          app:cardCornerRadius="16dp"
                          app:strokeColor="#1E293B"
                          app:strokeWidth="1dp"
                          android:layout_marginBottom="12dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:padding="14dp">

                              <TextView
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="اختر التطبيق المستهدف للتحكم:"
                                  android:textSize="13sp"
                                  android:textStyle="bold"
                                  android:textColor="#F9FAFB"
                                  android:layout_marginBottom="6dp"/>

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"
                                  android:layout_marginBottom="12dp">

                                  <EditText
                                      android:id="@+id/etTargetApp"
                                      android:layout_width="0dp"
                                      android:layout_height="44dp"
                                      android:layout_weight="1"
                                      android:hint="اختر تطبيقاً من القائمة..."
                                      android:textColor="#F9FAFB"
                                      android:textColorHint="#64748B"
                                      android:textSize="11sp"
                                      android:paddingHorizontal="10dp"
                                      android:background="@android:drawable/editbox_background_normal"
                                      android:backgroundTint="#030712"
                                      android:focusable="false"
                                      android:clickable="true"/>

                                  <com.google.android.material.button.MaterialButton
                                      android:id="@+id/btnPickApp"
                                      android:layout_width="wrap_content"
                                      android:layout_height="44dp"
                                      android:text="قائمة التطبيقات"
                                      android:textSize="11sp"
                                      app:backgroundTint="#2563EB"
                                      app:cornerRadius="8dp"
                                      android:layout_marginStart="6dp"/>
                              </LinearLayout>

                              <TextView
                                  android:id="@+id/tvDownLimitLabel"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="حد سرعة التطبيق المختار: 256 KB/s"
                                  android:textSize="13sp"
                                  android:textStyle="bold"
                                  android:textColor="#38BDF8"
                                  android:layout_marginBottom="4dp"/>

                              <SeekBar
                                  android:id="@+id/seekBarDown"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:max="4096"
                                  android:progress="256"
                                  android:progressTint="#38BDF8"
                                  android:thumbTint="#38BDF8"
                                  android:layout_marginBottom="12dp"/>

                              <CheckBox
                                  android:id="@+id/cbBlockApp"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="قطع الإنترنت كلياً عن هذا التطبيق (Firewall Block)"
                                  android:textColor="#FCA5A5"
                                  android:textSize="12sp"
                                  android:buttonTint="#EF4444"
                                  android:layout_marginBottom="4dp"/>
                          </LinearLayout>
                      </com.google.android.material.card.MaterialCardView>

                      <!-- أزرار التشغيل -->
                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnEnable"
                          android:layout_width="match_parent"
                          android:layout_height="52dp"
                          android:text="تشغيل وعزل تطبيق السرعة"
                          android:textSize="15sp"
                          android:textStyle="bold"
                          android:textColor="#FFFFFF"
                          app:backgroundTint="#10B981"
                          app:cornerRadius="12dp"
                          android:layout_marginBottom="8dp"/>

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnDisable"
                          android:layout_width="match_parent"
                          android:layout_height="50dp"
                          android:text="إيقاف التقييد وإلغاء الـ VPN"
                          android:textSize="14sp"
                          android:textStyle="bold"
                          android:textColor="#FFFFFF"
                          app:backgroundTint="#EF4444"
                          app:cornerRadius="12dp"
                          android:layout_marginBottom="12dp"/>

                      <com.google.android.material.card.MaterialCardView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          app:cardBackgroundColor="#0F172A"
                          app:cardCornerRadius="12dp">

                          <TextView
                              android:id="@+id/tvStatus"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:padding="12dp"
                              android:text="الحالة: متوقف (جميع التطبيقات تعمل بكامل السرعة)"
                              android:textColor="#94A3B8"
                              android:gravity="center"
                              android:textSize="12sp"
                              android:textStyle="bold"/>
                      </com.google.android.material.card.MaterialCardView>

                  </LinearLayout>
              </ScrollView>
          ''')

          write_clean_file("app/src/main/java/com/example/speedlimiter/SpeedV
