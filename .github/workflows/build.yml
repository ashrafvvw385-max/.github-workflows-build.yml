name: Build SpeedLimiter Elite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Elite Project Structure and Source Code
        run: |
          python3 - << 'PYEOF'
          import os
          import textwrap

          def write_clean_file(path, content):
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          write_clean_file("settings.gradle", r'''
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "SpeedLimiterElite"
              include ':app'
          ''')

          write_clean_file("gradle.properties", r'''
              android.useAndroidX=true
              org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
              android.nonTransitiveRClass=true
          ''')

          write_clean_file("build.gradle", r'''
              plugins {
                  id 'com.android.application' version '8.2.2' apply false
                  id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              }
          ''')

          write_clean_file("app/build.gradle", r'''
              plugins {
                  id 'com.android.application'
                  id 'org.jetbrains.kotlin.android'
              }

              android {
                  namespace 'com.example.speedlimiter'
                  compileSdk 34

                  defaultConfig {
                      applicationId "com.example.speedlimiter"
                      minSdk 24
                      targetSdk 34
                      versionCode 5
                      versionName "5.0-Elite"
                  }

                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }

                  kotlinOptions {
                      jvmTarget = '17'
                  }
              }

              dependencies {
                  implementation 'androidx.core:core-ktx:1.12.0'
                  implementation 'androidx.appcompat:appcompat:1.6.1'
                  implementation 'com.google.android.material:material:1.11.0'
              }
          ''')

          write_clean_file("app/src/main/AndroidManifest.xml", r'''
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                  <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

                  <application
                      android:allowBackup="true"
                      android:label="متحكم السرعة Elite"
                      android:supportsRtl="true"
                      android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">

                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:screenOrientation="portrait">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>

                      <service
                          android:name=".SpeedVpnService"
