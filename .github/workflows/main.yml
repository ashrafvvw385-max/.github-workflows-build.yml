name: Auto Build SpeedLimiter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Complete Android Project & Source Code
        run: |
          # 1. إنشاء المجلدات الأساسية للمشروع
          mkdir -p app/src/main/java/com/example/myspeedlimiter
          mkdir -p app/src/main/res/layout

          # 2. إنشاء ملف settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MySpeedLimiter"
          include ':app'
          EOF

          # 3. إنشاء ملف gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # 4. إنشاء ملف build.gradle الرئيسي
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # 5. إنشاء ملف app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.myspeedlimiter'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.myspeedlimiter"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 6. إنشاء ملف AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="متحكم السرعة"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. إنشاء ملف الواجهة الرسومية (activity_main.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center"
              android:background="#121212">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="متحكم سرعة جهازي"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:textColor="#FFFFFF"
                  android:gravity="center"
                  android:layout_marginBottom="30dp"/>

              <TextView
                  android:id="@+id/tvSpeedValue"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="السرعة المحددة: 256 KB/s"
                  android:textSize="18sp"
                  android:textColor="#00E676"
                  android:gravity="center"
                  android:layout_marginBottom="12dp"/>

              <SeekBar
                  android:id="@+id/seekBarSpeed"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:max="2048"
                  android:progress="256"
                  android:layout_marginBottom="24dp"/>

              <CheckBox
                  android:id="@+id/cbMobileData"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="تطبيق على بيانات الهاتف (بدلاً من الواي فاي)"
                  android:textColor="#E0E0E0"
                  android:layout_marginBottom="24dp"/>

              <Button
                  android:id="@+id/btnEnable"
                  android:layout_width="match_parent"
                  android:layout_height="55dp"
                  android:text="تفعيل التحديد الآن"
                  android:backgroundTint="#00C853"
                  android:textColor="#FFFFFF"
                  android:textStyle="bold"
                  android:layout_marginBottom="12dp"/>

              <Button
                  android:id="@+id/btnDisable"
                  android:layout_width="match_parent"
                  android:layout_height="55dp"
                  android:text="إيقاف (فتح السرعة كاملة)"
                  android:backgroundTint="#D50000"
                  android:textColor="#FFFFFF"
                  android:textStyle="bold"
                  android:layout_marginBottom="24dp"/>

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="الحالة: غير مفعل (السرعة كاملة)"
                  android:textColor="#B0BEC5"
                  android:gravity="center"
                  android:textSize="14sp"/>

          </LinearLayout>
          EOF

          # 8. إنشاء الكود البرمجي الكامل (MainActivity.kt)
          cat << 'EOF' > app/src/main/java/com/example/myspeedlimiter/MainActivity.kt
          package com.example.myspeedlimiter

          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import java.io.DataOutputStream
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private var selectedSpeedKBytes = 256

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val tvSpeedValue = findViewById<TextView>(R.id.tvSpeedValue)
                  val seekBarSpeed = findViewById<SeekBar>(R.id.seekBarSpeed)
                  val cbMobileData = findViewById<CheckBox>(R.id.cbMobileData)
                  val btnEnable = findViewById<Button>(R.id.btnEnable)
                  val btnDisable = findViewById<Button>(R.id.btnDisable)
                  val tvStatus = findViewById<TextView>(R.id.tvStatus)

                  seekBarSpeed.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          selectedSpeedKBytes = if (progress < 16) 16 else progress
                          tvSpeedValue.text = "السرعة المحددة: $selectedSpeedKBytes KB/s"
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })

                  btnEnable.setOnClickListener {
                      val isMobile = cbMobileData.isChecked
                      tvStatus.text = "جاري تطبيق السرعة..."
                      thread {
                          val success = limitMyDeviceSpeed(selectedSpeedKBytes, isMobile)
                          runOnUiThread {
                              if (success) {
                                  tvStatus.text = "الحالة: نشط ($selectedSpeedKBytes KB/s)"
                              } else {
                                  tvStatus.text = "فشل: تأكد من منح صلاحية الروت (Magisk/Root)"
                              }
                          }
                      }
                  }

                  btnDisable.setOnClickListener {
                      thread {
                          resetMyDeviceSpeed()
                          runOnUiThread {
                              tvStatus.text = "الحالة: غير مفعل (السرعة كاملة)"
                          }
                      }
                  }
              }

              private fun limitMyDeviceSpeed(kbytesPerSec: Int, isMobileData: Boolean): Boolean {
                  val kbits = kbytesPerSec * 8
                  val interfaces = if (isMobileData) {
                      listOf("rmnet_data0", "rmnet_data1", "ccmni0", "ccmni1", "pdp0")
                  } else {
                      listOf("wlan0")
                  }

                  val commands = mutableListOf<String>()
                  for (iface in interfaces) {
                      commands.add("tc qdisc del dev $iface root 2>/dev/null")
                      commands.add("tc qdisc del dev $iface ingress 2>/dev/null")
                      commands.add("tc qdisc add dev $iface root tbf rate ${kbits}kbit burst 32kbit latency 400ms 2>/dev/null")
                      commands.add("tc qdisc add dev $iface handle ffff: ingress 2>/dev/null")
                      commands.add("tc filter add dev $iface parent ffff: protocol ip prio 50 u32 match ip src 0.0.0.0/0 police rate ${kbits}kbit burst 64kbit drop flowid :1 2>/dev/null")
                  }

                  return runRootCommands(commands)
              }

              private fun resetMyDeviceSpeed(): Boolean {
                  val allInterfaces = listOf("wlan0", "rmnet_data0", "rmnet_data1", "ccmni0", "ccmni1", "pdp0")
                  val commands = allInterfaces.flatMap { iface ->
                      listOf(
                          "tc qdisc del dev $iface root 2>/dev/null",
                          "tc qdisc del dev $iface ingress 2>/dev/null"
                      )
                  }
                  return runRootCommands(commands)
              }

              private fun runRootCommands(commands: List<String>): Boolean {
                  return try {
                      val process = Runtime.getRuntime().exec("su")
                      val os = DataOutputStream(process.outputStream)
                      for (cmd in commands) {
                          os.writeBytes("$cmd\n")
                      }
                      os.writeBytes("exit\n")
                      os.flush()
                      process.waitFor() == 0
                  } catch (e: Exception) {
                      false
                  }
              }
          }
          EOF

      - name: Install Gradle & Build APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Assemble Debug APK
        run: gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLimiter-Ready-APK
          path: app/build/outputs/apk/debug/app-debug.apk
